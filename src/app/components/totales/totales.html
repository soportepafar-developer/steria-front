<div class="stats-floating-bar" *ngIf="visible()">
  <!-- Radio Bases -->
  <div class="stat-item clickable" [class.active]="esActivo('antenas')" [class.dimmed]="hayFiltroActivo() && !esActivo('antenas')" (click)="toggleElemento('antenas')" title="Mostrar/ocultar Radio Bases">
    <div class="icon-circle pink">
      <i class="fas fa-broadcast-tower"></i>
    </div>
    <div class="stat-texts">
      <span class="label">RADIO BASES</span>
      <span class="value">{{ formatear(totalAntenas()) }}</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Abonados -->
  <div class="stat-item clickable" [class.active]="esActivo('abonados')" [class.dimmed]="hayFiltroActivo() && !esActivo('abonados')" (click)="toggleElemento('abonados')" title="Mostrar/ocultar Abonados">
    <div class="icon-circle blue">
      <i class="fas fa-user-check"></i>
    </div>
    <div class="stat-texts">
      <span class="label">ABONADOS</span>
      <span class="value">{{ formatear(totalAbonados()) }}</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Oficinas -->
  <div class="stat-item clickable" [class.active]="esActivo('oficinas')" [class.dimmed]="hayFiltroActivo() && !esActivo('oficinas')" (click)="toggleElemento('oficinas')" title="Mostrar/ocultar Oficinas">
    <div class="icon-circle green">
      <i class="fas fa-building"></i>
    </div>
    <div class="stat-texts">
      <span class="label">OFICINAS</span>
      <span class="value">{{ formatear(totalOficinas()) }}</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Agentes -->
  <div class="stat-item clickable" [class.active]="esActivo('agentes')" [class.dimmed]="hayFiltroActivo() && !esActivo('agentes')" (click)="toggleElemento('agentes')" title="Mostrar/ocultar Agentes">
    <div class="icon-circle orange">
      <i class="fas fa-store"></i>
    </div>
    <div class="stat-texts">
      <span class="label">AGENTES</span>
      <span class="value">{{ formatear(totalAgentes()) }}</span>
    </div>
  </div>
</div>
